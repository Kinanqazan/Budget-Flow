plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kinanqaz.budgetflow'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kinanqaz.budgetflow'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def signingFile = rootProject.file('keystore.properties')
            if (signingFile.exists()) {
                def signing = new Properties()
                signingFile.withInputStream { signing.load(it) }
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

